<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Mate AI - Login</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f5ff;

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
    }

    .login-container {
        width: 380px;
        background: white;

        padding: 35px;
        border-radius: 15px;

        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
    }

    .title {
        text-align: center;
        margin-bottom: 5px;
        color: #333;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 13px;

        border: 1px solid #ccc;
        border-radius: 8px;

        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #5b5bea;
    }

    /* Password area */

    .password-container {
        position: relative;
    }

    .password-container input {
        padding-right: 45px;
    }

    #showPassword {
        position: absolute;
        right: 10px;
        top: 50%;

        transform: translateY(-50%);

        border: none;
        background: none;

        cursor: pointer;
        font-size: 18px;
    }

    /* Login button */

    #loginBtn {
        width: 100%;

        padding: 13px;
        margin-top: 20px;

        border: none;
        border-radius: 8px;

        background: #4d4de8;
        color: white;

        font-size: 16px;
        cursor: pointer;
    }

    #loginBtn:hover {
        background: #3838c9;
    }

    /* Sign Up */

    .signup {
        text-align: center;
        margin-top: 20px;
    }

    .signup a {
        color: #4d4de8;
        text-decoration: none;
        font-weight: bold;
    }

    /* Message */

    #message {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }
</style>

</head> <body>
<div class="login-container">

    <h2 class="title">Study Mate AI</h2>

    <p class="subtitle">
        Login to continue learning
    </p>

    <!-- Email -->

    <label for="email">Email</label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
    >

    <!-- Password -->

    <label for="password">Password</label>

    <div class="password-container">

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >   
        <button
            type="button"
            id="showPassword"
        >  🙈 </button>

    </div>

    <!-- Login -->

    <button id="loginBtn">
        Login
    </button>

    <!-- Sign Up -->

    <div class="signup">

        Don't have an account?

        <a href="Signup.html">
            Sign Up
        </a>

    </div>

    <!-- Message -->

    <p id="message"></p>

</div>

<!-- JavaScript -->

<script
    type="module"
    src="login.js">
</script>

</body> </html>
