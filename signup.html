<<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Mate AI - Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6ff;
        }

        .signup-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <h1>Create Account</h1>

        <p class="subtitle">
            Join Study Mate AI
        </p>

        <!-- SIGN UP FORM -->

        <form id="signupForm">

            <!-- Name -->

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <!-- Email -->

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <!-- Password -->

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                required
            >

            <!-- Confirm Password -->

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
            >

            <!-- Create Account Button -->

            <button type="submit">
                Create Account
            </button>

        </form>

        <!-- LOGIN -->

        <p class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

    <!-- FIREBASE SIGNUP JAVASCRIPT -->

    <script type="module" src="Signup.js"></script>

</body>

</html>
